      Panel de autoadministración (Decap CMS). Solo para el dueño del negocio:
      edita precios, disponibilidad, fotos, promos y FAQ SIN tocar código ni
      maquetado. El schema (config.yml + Content Collections) valida cada campo,
      así que es imposible romper el sitio al editar contenido.

      Se carga desde CDN porque es una herramienta de back-office privada
      (noindex), no la web pública. La web de conversión no depende de esto.
    -->
