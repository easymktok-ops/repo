<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon-admin.svg" />
    <title>Aerodiverti · Administración de contenido</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!--
      Panel de autoadministración (Decap CMS). Solo para el dueño del negocio:
      edita precios, disponibilidad, fotos, promos y FAQ SIN tocar código ni
      maquetado. El schema (config.yml + Content Collections) valida cada campo,
      así que es imposible romper el sitio al editar contenido.

      Se carga desde CDN porque es una herramienta de back-office privada
      (noindex), no la web pública. La web de conversión no depende de esto.

      Versión FIJA: admin.css estiliza la interfaz de Decap por sus nombres de
      componente; una versión nueva podría cambiarlos. Al actualizar, revisar
      /admin con admin.css (tema) y admin.js (vista previa y recorrido).
    -->
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script src="/ui/tour.js"></script>
    <script src="/admin/admin.js"></script>
  </body>
</html>
