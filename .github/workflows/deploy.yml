name: Deploy sitio (build + FTP)

# Reconstruye el sitio estatico y, SI la publicacion automatica esta activada,
# lo sube al hosting por FTP. Se ejecuta en cada cambio de la rama del proyecto
# (incluye los commits que hace /admin al publicar) y tambien a mano desde la
# pestana Actions (workflow_dispatch).
#
# SEGURIDAD: el sitio estatico vive en la misma carpeta que el backend PHP y la
# base de reservas (server/ y su SQLite). El bloque `exclude` PROTEGE esas rutas:
# nunca se suben ni se borran desde aqui. No quites esas lineas.
#
# ---------------------------------------------------------------------------
# INTERRUPTOR DE PUBLICACION AUTOMATICA
# Por defecto esta APAGADA: el workflow solo COMPILA (queda en verde, sin subir
# nada y sin mandar correos de error). Para ACTIVARLA, en GitHub ->
# Settings -> Secrets and variables -> Actions:
#   Variables:
#     AUTO_DEPLOY     = on
#     PUBLIC_SITE_URL = https://aerodiverti.com.mx
#     FTP_SERVER_DIR  = public_html/
#   Secrets (del hosting; ver "Cuentas FTP" en Webempresa, boton
#            "Configurar cliente FTP" para el usuario/host EXACTOS):
#     FTP_SERVER      = host FTP (p.ej. cp5027.webempresa.eu)
#     FTP_USERNAME    = usuario FTP EXACTO (a veces usuario@aerodiverti.com.mx)
#     FTP_PASSWORD    = su contrasena
# Un "530 Login authentication failed" = usuario/clave/host incorrectos.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [claude/aerodiverti-platform-xajbkz]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Estado de publicacion automatica
        run: |
          echo "DEPLOY_ON=${{ vars.AUTO_DEPLOY == 'on' && secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}" >> "$GITHUB_ENV"
          echo "FAST_DEPLOY=${{ vars.DEPLOY_URL != '' && secrets.DEPLOY_TOKEN != '' }}" >> "$GITHUB_ENV"

      - name: Aviso de estado
        run: |
          if [ "$DEPLOY_ON" != "true" ]; then
            echo "::notice::Build OK. Publicacion automatica en pausa (AUTO_DEPLOY no esta en 'on' o faltan secrets FTP). No se sube nada."
          elif [ "$FAST_DEPLOY" = "true" ]; then
            echo "::notice::Build OK. Publicacion RAPIDA (ZIP + extractor PHP) activa. Si falla, cae al respaldo lftp."
          else
            echo "::notice::Build OK. Publicacion por lftp (mirror). Configura DEPLOY_URL + DEPLOY_TOKEN para el modo rapido (ZIP)."
          fi

      # -----------------------------------------------------------------------
      # VIA RAPIDA (recomendada): comprime dist/ en UN zip, lo sube por FTP (un
      # solo archivo, sin los cortes de sesion) y llama al extractor PHP que lo
      # descomprime en el servidor. Deploy de ~1-2 min. Requiere en el hosting:
      #   - server/public/api/deploy-extract.php subido,
      #   - 'deploy_token' en config.php == secret DEPLOY_TOKEN de GitHub,
      #   - variable DEPLOY_URL = https://<dominio>/api/deploy-extract.php
      # Si falla (continue-on-error), corre el respaldo lftp de abajo, asi que
      # una publicacion nunca se queda sin subir.
      # -----------------------------------------------------------------------
      - name: Publicar rapido (ZIP + extractor PHP)
        id: fast
        if: env.DEPLOY_ON == 'true' && env.FAST_DEPLOY == 'true'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip
          ( cd dist && zip -r -q -X ../site-deploy.zip . )
          echo "Zip creado: $(du -h site-deploy.zip | cut -f1)"
          REMOTE="${FTP_DIR%/}/"
          # Sube UN solo archivo (lftp reanuda si el host corta la conexion).
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 15;
            set net:persist-retries 15;
            set net:reconnect-interval-base 4;
            set net:timeout 25;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\";
            put -O \"${REMOTE}\" site-deploy.zip;
          "
          echo "Zip subido. Llamando al extractor..."
          resp="$(curl -fsS --max-time 120 -X POST "$DEPLOY_URL" -H "X-Deploy-Token: ${DEPLOY_TOKEN}")"
          echo "Respuesta del extractor: $resp"
          echo "$resp" | grep -q '"ok":true'
          echo "Publicacion rapida OK."

      # -----------------------------------------------------------------------
      # RESPALDO: la cuenta de deploy esta en la lista blanca de Webempresa
      # (Seguridad FTP -> Cuenta FTP, sin restriccion regional), por lo que el
      # login FTPS desde las IPs rotativas de GitHub Actions ya no se bloquea.
      #
      # Se usa lftp (no una action) porque el servidor CORTA la sesion FTPS a
      # mitad del primer envio (cientos de variantes AVIF): "Server sent FIN
      # packet unexpectedly". lftp RECONECTA solo y REANUDA el mirror, asi que
      # el envio completo se logra en varios tramos automaticos.
      #
      # SEGURIDAD DEL BACKEND: se usa `mirror -R` (subida) SIN `--delete`, por
      # lo que NUNCA se borra nada en el servidor. El backend (server/, la BD
      # SQLite, config.php) y el .htaccess de produccion quedan intactos: no
      # viven en dist/ y, al no borrar, siguen ahi. SI se sube data/ porque ahi
      # va catalog.json (autoridad de precios que LEE el backend); excluir data/
      # dejaria los precios sin actualizar en el cobro.
      #
      # Dos tiers:
      #   1) _assets/  -> nombres con huella de contenido (inmutables): mirror
      #      con --ignore-time (compara tamano/existencia) => reanudable, salta
      #      lo ya subido tras cada reconexion.
      #   2) resto     -> pocos archivos mutables (HTML, data/catalog.json,
      #      admin/): mirror por tiempo. El checkout deja mtime "ahora" > remoto,
      #      asi que SIEMPRE se re-suben => capta ediciones aunque el archivo
      #      quede del mismo tamano (p.ej. cambiar 2200 por 2500).
      #
      # El paso solo corre si AUTO_DEPLOY='on' y los 3 secrets FTP existen.
      # -----------------------------------------------------------------------
      - name: Publicar por FTP (lftp con reconexion) [respaldo]
        if: env.DEPLOY_ON == 'true' && (env.FAST_DEPLOY != 'true' || steps.fast.outcome == 'failure')
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          REMOTE="${FTP_DIR%/}/"
          echo "Publicando dist/ -> ${REMOTE} en ${FTP_SERVER}"
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 20;
            set net:persist-retries 20;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set net:timeout 25;
            set mirror:parallel-transfer-count 1;
            set mirror:set-permissions off;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\";
            mirror -R --ignore-time --no-perms --verbose=1 ./dist/_assets/ \"${REMOTE}_assets/\";
            mirror -R --no-perms --verbose=1 --exclude '^_assets/' --exclude '^server/' --exclude-glob .htaccess --exclude-glob .htaccess.old --exclude '^\.well-known/' --exclude-glob .ftp-deploy-sync-state.json ./dist/ \"${REMOTE}\";
          "
          echo "Deploy completado."
