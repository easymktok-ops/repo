name: Deploy sitio (build + FTP)

# Reconstruye el sitio estatico y lo publica en el hosting cada vez que cambia
# `main` (incluye los commits que hace el panel de contenido /admin al publicar).
# Tambien se puede lanzar a mano desde la pestana Actions (workflow_dispatch).
#
# SEGURIDAD: el sitio estatico vive en la misma carpeta que el backend PHP y la
# base de reservas (server/ y su SQLite). El bloque `exclude` PROTEGE esas rutas:
# nunca se suben ni se borran desde aqui. No quites esas lineas.

on:
  push:
    # `main` = produccion. La rama de trabajo se incluye temporalmente para
    # desplegar el beta en staging (FTP ya sin geo-bloqueo).
    branches: [main, claude/aerodiverti-platform-xajbkz]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build
        env:
          # URL absoluta del entorno destino (sitemap/canonical). Se define como
          # Variable del repo, no se hardcodea. Staging o produccion segun el caso.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Publicar por FTP (lftp, resiliente a cortes de conexion)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          TARGET="${FTP_DIR:-/}"
          # SEGURIDAD: mirror SIN --delete. Solo SUBE lo que hay en dist/ (el
          # sitio estatico). Nunca toca server/, data/, aerodiverti.com/ ni la
          # base de reservas: esas rutas no existen en dist/ y aqui no se borra
          # nada en el servidor. lftp reconecta solo si el FTP corta (el FIN).
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 5;
            set net:timeout 25;
            set net:reconnect-interval-base 5;
            set net:connection-limit 1;
            set mirror:parallel-transfer-count 1;
            mirror --reverse --verbose --ignore-time ./dist/ '$TARGET';
            bye
          "
